<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playwright Explorer · See how test automation really works</title>
<link rel="stylesheet" href="explorer.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <div class="mark"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 2l8 4.5v9L12 20l-8-4.5v-9z"/><path d="M12 11l8-4.5M12 11L4 6.5M12 11v9"/></svg></div>
    <div><h1>PLAYWRIGHT <i>EXPLORER</i></h1><small>SEE HOW TEST AUTOMATION REALLY WORKS</small></div>
  </div>
  <div class="group"><span>Layer <b id="layerName">All</b></span><div class="layers" id="layers"></div></div>
  <button id="searchBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>Search scenarios and steps<kbd>Ctrl K</kbd></button>
  <button class="ibtn" id="bList" title="Scenario list (L)">☰</button>
  <button class="ibtn" id="bDiag" title="Diagram only (D)">▭</button>
  <button class="ibtn" id="bFull" title="Fullscreen (F)">⛶</button>
  <button class="ibtn" id="bKeys" title="Keyboard shortcuts (?)">⌨</button>
  <div class="group"><span>Code language</span><div class="seg" id="langSeg"><button data-l="ts" class="on">TypeScript</button><button data-l="java">Java</button></div></div>
  <div class="spacer"></div>
  <a class="btn" href="playwright-deep-dive-en.html" id="bookLink">📖 Study Book</a>
  <button class="ibtn" id="bTheme" title="Light / dark (T)">☾</button>
</header>

<div id="grid">
  <aside class="panel" id="left">
    <div class="ph"><h2>Scenarios</h2></div>
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
  </aside>

  <section class="panel" id="center">
    <div class="viewtabs"><button id="vNet" class="on">⬡ NETWORK</button><button id="vSeq">⇄ SEQUENCE</button></div>
    <div id="stage"><svg id="svg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div id="seq"></div>
    <div id="insp"></div>
  </section>

  <aside class="panel" id="right">
    <div class="ph"><h2 id="rhead">Overview</h2><button class="btn" id="bBack" style="display:none">‹ Overview</button></div>
    <div id="rbody"></div>
  </aside>

  <section class="panel" id="bottom">
    <div class="ph">
      <div class="legend"><h2 style="margin-right:14px">Command Flow</h2><span id="legend"></span><em class="hint">Click a row to inspect the message</em></div>
      <div class="ctl">
        <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        <button class="btn" id="bPrev">‹</button>
        <button class="btn play" id="bPlay">▶ PLAY</button>
        <button class="btn" id="bStep">STEP</button>
        <button class="btn" id="bReset">↻ RESET</button>
      </div>
    </div>
    <div id="tbl"></div>
  </section>
</div>

<div class="modal" id="mSearch"><div class="mbox"><h3>SEARCH <button class="btn" data-close>Esc</button></h3><input id="q" placeholder="Try: auto-wait, storageState, adb, electron, appium…" autocomplete="off"><div class="res" id="res"></div></div></div>
<div class="modal" id="mKeys"><div class="mbox"><h3>KEYBOARD SHORTCUTS <button class="btn" data-close>Esc</button></h3><div class="sh" id="shList"></div></div></div>

<script src="scenarios/web.js"></script>
<script src="scenarios/mobile.js"></script>
<script src="scenarios/desktop.js"></script>
<script src="explorer.js"></script>
</body>
</html>
